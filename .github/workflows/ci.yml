name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: lint
            command: npm run lint
          - gate: typecheck
            command: npm run typecheck
          - gate: unit-tests
            command: npm test
          - gate: production-build
            command: npm run build
          - gate: dependency-audit
            command: npm audit --audit-level=high
          - gate: market-calendar
            command: npm run verify:market-calendar
          - gate: browser-secret-containment
            command: npm run verify:browser-secrets
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify toolchain
        run: npm run verify:toolchain
      - name: Install frozen dependencies
        run: npm ci
      - name: Run ${{ matrix.gate }}
        run: ${{ matrix.command }}

  e2e:
    name: Quality / Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify toolchain
        run: npm run verify:toolchain
      - name: Install frozen dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production application
        run: npm run build
      - name: Run deterministic browser suite
        run: npm run test:e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  supabase-isolation:
    name: Quality / Supabase isolation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify toolchain
        run: npm run verify:toolchain
      - name: Install frozen dependencies
        run: npm ci
      - name: Start disposable Supabase stack
        run: npm run supabase:start:test
      - name: Reset and verify account isolation
        run: npm run test:supabase
      - name: Stop disposable Supabase stack
        if: always()
        run: npx supabase stop --no-backup
