name: Wheel Screener Refresh

on:
  schedule:
    # Offset from the top of the hour to avoid colliding with market-data
    # publication boundaries. The route enforces versioned New York sessions,
    # holidays, early closes, DST, and the final-day prewarm window.
    - cron: "7,22,37,52 13-23 * * 1-5"
    - cron: "7,22,37,52 20-23 * * 0"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger wheel screener refresh
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WHEEL_SCREENER_CRON_URL: ${{ secrets.WHEEL_SCREENER_CRON_URL }}
        run: |
          if [ -z "$WHEEL_SCREENER_CRON_URL" ]; then
            echo "WHEEL_SCREENER_CRON_URL secret is required."
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is required."
            exit 1
          fi

          curl --fail-with-body --show-error --silent \
            --request GET \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$WHEEL_SCREENER_CRON_URL"
